<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请使用浏览器打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            opacity: 0.9;
        }
        
        .guide-box {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .guide-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .guide-box h2 .icon {
            margin-right: 8px;
        }
        
        .steps {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }
        
        .step {
            display: flex;
            align-items: flex-start;
        }
        
        .step-number {
            background: white;
            color: #2E7D32;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .browsers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        
        .browser {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .browser-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .browser-name {
            font-size: 14px;
        }
        
        .btn {
            display: inline-block;
            background: white;
            color: #2E7D32;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
        
        .loading {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid rgba(244, 67, 54, 0.5);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🌐</div>
        <h1>请使用浏览器打开</h1>
        <p>检测到您在微信/QQ内打开，部分功能受限</p>
        
        <div id="errorMessage" class="error-message hidden">
            <!-- 错误信息将在这里显示 -->
        </div>
        
        <div class="guide-box">
            <h2><span class="icon">⚠️</span> 操作指引</h2>
            <div class="steps">
                <div class="step">
                    <div class="step-number">1</div>
                    <div>点击右上角 <strong>···</strong> 菜单按钮</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div>选择 <strong>"在浏览器打开"</strong> 选项</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div>在浏览器中继续访问目标页面</div>
                </div>
            </div>
        </div>
        
        <div class="browsers">
            <div class="browser">
                <div class="browser-icon">🌐</div>
                <div class="browser-name">Chrome</div>
            </div>
            <div class="browser">
                <div class="browser-icon">🔍</div>
                <div class="browser-name">Safari</div>
            </div>
            <div class="browser">
                <div class="browser-icon">🦊</div>
                <div class="browser-name">Firefox</div>
            </div>
        </div>
        
        <div class="loading" id="loadingMessage">
            <span class="spinner"></span>检测浏览器环境...
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loadingMessage = document.getElementById('loadingMessage');
            const errorMessage = document.getElementById('errorMessage');
            
            // 获取URL参数
            function getUrlParameter(name) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(name);
            }
            
            // 检测是否在微信/QQ中打开
            function isWechatOrQQ() {
                const ua = navigator.userAgent.toLowerCase();
                return ua.indexOf('micromessenger') !== -1 || ua.indexOf('qq/') !== -1;
            }
            
            // 验证ID参数
            const idParam = getUrlParameter('id');
            
            // 如果在微信/QQ中，显示引导信息
            if (isWechatOrQQ()) {
                loadingMessage.textContent = '检测到您在微信/QQ中，请使用浏览器打开';
                return;
            }
            
            // 如果在浏览器中，验证参数
            if (idParam === '5687') {
                // 参数正确，直接跳转
                loadingMessage.innerHTML = '<span class="spinner"></span>正在跳转到目标页面...';
                setTimeout(function() {
                    window.location.href = 'https://2080.xn--d6qc7506a.com/dgFL14';
                }, 500);
            } else {
                // 参数错误或缺失
                errorMessage.innerHTML = '参数错误！请使用正确的ID参数访问';
                errorMessage.classList.remove('hidden');
                loadingMessage.textContent = '检测到参数错误，无法跳转';
            }
        });
    </script>
</body>
</html>
