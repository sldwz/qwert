<!DOCTYPE html>
<html>
<head>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
<title>客服</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    
    /* 完全隐藏博客和加载动画的样式 */
    #blog-page, #loading, #infrm {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
    }
    
    #blog-page {
        background: white;
        overflow-y: auto;
        z-index: 1;
    }
    
    #loading {
        z-index: 9999;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #loading-text {
        font-size: 20px;
    }
    
    #infrm {
        z-index: 2;
        border: none;
    }
    
    .hidden {
        display: none !important;
    }
    
    /* 博客样式 */
    .blog-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
    }
    
    .blog-header {
        text-align: center;
        padding: 40px 0 30px;
        border-bottom: 1px solid #eee;
    }
    
    .blog-title {
        font-size: 32px;
        color: #333;
        margin-bottom: 10px;
    }
    
    .blog-subtitle {
        font-size: 18px;
        color: #666;
    }
    
    .blog-content {
        padding: 30px 0;
        line-height: 1.8;
    }
    
    .blog-articles {
        margin-top: 40px;
    }
    
    .article {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
    }
    
    .article-title {
        font-size: 20px;
        color: #333;
        margin-bottom: 10px;
    }
    
    .article-meta {
        color: #999;
        font-size: 14px;
        margin-bottom: 10px;
    }
    
    .article-content {
        color: #555;
        line-height: 1.6;
    }
    
    .blog-footer {
        text-align: center;
        padding: 20px;
        color: #999;
        font-size: 14px;
        border-top: 1px solid #eee;
        margin-top: 40px;
    }
</style>
</head>

<body>
    <!-- 个人博客首页 -->
    <div id="blog-page" class="hidden">
        <div class="blog-container">
            <div class="blog-header">
                <h1 class="blog-title">技术博客</h1>
                <p class="blog-subtitle">分享技术，记录成长</p>
            </div>
            
            <div class="blog-content">
                <!-- 博客文章部分 -->
                <div class="blog-articles">
                    <div class="article">
                        <h3 class="article-title">前端开发入门指南</h3>
                        <div class="article-meta">2024年1月15日 | 前端开发</div>
                        <div class="article-content">
                            前端开发是构建网站和应用程序用户界面的过程。HTML、CSS和JavaScript是前端开发的三大核心技术...
                        </div>
                    </div>
                    
                    <div class="article">
                        <h3 class="article-title">JavaScript 最佳实践</h3>
                        <div class="article-meta">2024年1月10日 | JavaScript</div>
                        <div class="article-content">
                            编写高质量的JavaScript代码需要注意代码规范、性能优化、错误处理等多个方面...
                        </div>
                    </div>
                    
                    <div class="article">
                        <h3 class="article-title">现代Web技术趋势</h3>
                        <div class="article-meta">2024年1月5日 | 技术趋势</div>
                        <div class="article-content">
                            随着Web技术的不断发展，越来越多的新技术和框架涌现出来，为开发者提供了更多选择...
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="blog-footer">
                © 2024 个人技术博客
            </div>
        </div>
    </div>
    
    <!-- 保持原有的加载动画 -->
    <div id="loading" class="hidden">
        <span id="loading-text">Loading...</span>
    </div>
    
    <!-- 完全保持原有的iframe，不做任何修改 -->
    <iframe id="infrm" name="infrm" marginwidth="0" marginheight="0" width="100%" scrolling=auto src="" frameborder="0" height="100%" allowfullscreen="true" class="hidden"></iframe>

<script>
    // 获取DOM元素
    const blogPage = document.getElementById('blog-page');
    const loading = document.getElementById('loading');
    const iframe = document.getElementById('infrm');
    const loadingText = document.getElementById('loading-text');
    
    // 获取URL参数
    function getUrlParam(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
    }
    
    // 验证URL
    function isValidURL(string) {
        try {
            new URL(string);
            return true;
        } catch (_) {
            return false;
        }
    }
    
    // 加载页面到iframe
    function loadPage(url) {
        // 隐藏博客，显示iframe
        blogPage.classList.add('hidden');
        
        // 显示加载动画
        loading.classList.remove('hidden');
        iframe.classList.add('hidden');
        
        // 保持原有的超时逻辑
        var timeout = setTimeout(function() {
            loading.style.display = 'none';
            iframe.classList.remove('hidden');
        }, 3000);
        
        // 保持原有的iframe加载逻辑
        iframe.src = url;
        iframe.onload = function() {
            clearTimeout(timeout);
            loading.style.display = 'none';
            loading.classList.add('hidden');
            iframe.classList.remove('hidden');
        };
        
        // 保持原有的iframe错误处理
        iframe.onerror = function() {
            clearTimeout(timeout);
            loading.style.display = 'none';
            loading.classList.add('hidden');
            iframe.classList.add('hidden');
            blogPage.classList.remove('hidden');
            alert('加载失败，请检查网址是否正确');
        };
    }
    
    // 页面加载时检查URL参数
    document.addEventListener('DOMContentLoaded', function() {
        const urlParam = getUrlParam('url');
        
        if (urlParam) {
            const decodedUrl = decodeURIComponent(urlParam);
            if (isValidURL(decodedUrl)) {
                // 如果有url参数，加载页面
                loadPage(decodedUrl);
            } else {
                // URL无效，显示博客
                blogPage.classList.remove('hidden');
            }
        } else {
            // 没有url参数，显示博客
            blogPage.classList.remove('hidden');
        }
        
        // 监听浏览器前进后退
        window.addEventListener('popstate', function() {
            const newUrlParam = getUrlParam('url');
            if (newUrlParam) {
                const decodedUrl = decodeURIComponent(newUrlParam);
                if (isValidURL(decodedUrl)) {
                    loadPage(decodedUrl);
                }
            } else {
                // 没有url参数，显示博客
                blogPage.classList.remove('hidden');
                loading.classList.add('hidden');
                iframe.classList.add('hidden');
                iframe.src = '';
            }
        });
    });
    
    // 保持原有的iframe加载逻辑（完全不变）
    var timeout = setTimeout(function() {
        loading.style.display = 'none';
    }, 2000);

    iframe.onload = function() {
        clearTimeout(timeout);
        loading.style.display = 'none';
    };
</script>
</body>
</html>
